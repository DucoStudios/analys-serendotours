<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Skyddad analys</title>
<style>
  :root{--bg:#faf7ef;--dot:rgba(43,42,36,.075);--paper:#fffefa;--ink:#2b2a24;--soft:#635f52;--line:#e7e0cd;--coral:#e0603c;--coral-shadow:#a8492c;--yellow:#f4c94f;--tape:#3a2e05;--bad:#c0392b;color-scheme:light}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background-color:var(--bg);background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.3px);background-size:22px 22px;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 14px rgba(30,25,10,.09);padding:28px;width:100%;max-width:380px}
  .tape{display:inline-block;background:var(--yellow);color:var(--tape);font-weight:800;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:2px;transform:rotate(-1.5deg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
  h1{font-size:1.6rem;font-weight:800;letter-spacing:-.01em;margin:14px 0 6px;text-decoration:underline;text-decoration-color:rgba(244,201,79,.7);text-decoration-thickness:.32em;text-underline-offset:-.12em;text-decoration-skip-ink:none}
  p{margin:.4em 0 1em;color:var(--soft)}
  input{width:100%;font:inherit;font-size:1.4rem;letter-spacing:.3em;text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input:focus{outline:none;border-color:#2f6fb0;box-shadow:0 0 0 3px #dbe9f5}
  button{margin-top:14px;width:100%;font:inherit;font-weight:700;padding:12px;border:0;border-radius:999px;background:var(--coral);color:#fffaf5;box-shadow:0 4px 0 var(--coral-shadow);cursor:pointer}
  button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--coral-shadow)}
  button:disabled{opacity:.6;cursor:wait}
  .err{color:var(--bad);font-weight:600;min-height:1.4em;margin:10px 0 0;text-align:center}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <span class="tape">Skyddad sida</span>
  <h1>Ange pinkod</h1>
  <p>Skriv in koden du har fått för att öppna analysen.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="32" aria-label="Pinkod" autofocus>
  <button id="go" type="submit">Öppna</button>
  <div class="err" id="err" role="alert"></div>
</form>
